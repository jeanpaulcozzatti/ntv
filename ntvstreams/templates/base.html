<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NTVstreams{% endblock %}</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="NTVstreams" href="feed.xml">
<link rel="stylesheet" href="static/colors_and_type.css">
<link rel="stylesheet" href="static/site.css">
</head>
<body>
<div class="page">
<header class="masthead">
  <a class="brand" href="index.html"><img src="static/favicon.svg" alt=""><span class="brand-name">NTVstreams</span></a>
  <div class="mast-right">
    <span class="kicker">UPDATED {{ data.updated_at | pt_time }}</span>
    <nav class="nav">
      <a href="index.html"{% if current == 'index.html' %} class="current"{% endif %}>Front Page</a>
      <a href="river.html"{% if current == 'river.html' %} class="current"{% endif %}>River</a>
      <a href="sources.html"{% if current == 'sources.html' %} class="current"{% endif %}>Sources</a>
      <a href="about.html"{% if current == 'about.html' %} class="current"{% endif %}>About</a>
    </nav>
  </div>
</header>
{% block body %}{% endblock %}
<footer class="footer">
  <span class="kicker">NTVstreams</span>
  <p>{{ footer_note }}</p>
  <nav><a href="sources.html">Sources</a><a href="about.html">About</a><a href="feed.xml">RSS</a></nav>
</footer>
</div>
</body>
</html>
