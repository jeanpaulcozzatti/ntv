[project]
name = "ntvstreams"
version = "0.1.0"
description = "Techmeme-style aggregator for Native American news and social media"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "anthropic",
    "python-ulid>=2.0",
]

[project.scripts]
ntv = "ntvstreams.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ntvstreams"]

[tool.pytest.ini_options]
markers = [
    "slow: live network",
    "live: calls the Claude API",
]
addopts = "-m 'not slow and not live'"
testpaths = ["tests"]
